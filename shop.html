<style>
:root{
  --b:#0A0A0A; --b2:#000; --b3:#161616;
  --ink:#F2F2F0; --ink-d:#787878; --ink-dd:#3a3936;
  --r:#FF2D2D; --teal:#FF2D2D;
  --line:rgba(242,242,240,.06); --line-mid:rgba(242,242,240,.12);
  --display:'Inter',ui-sans-serif,system-ui,sans-serif;
  --mono:'Space Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--b);color:var(--ink);font-family:var(--display);overflow-x:hidden}
a{color:inherit}
nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:22px 28px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;background:linear-gradient(to bottom, rgba(10,10,10,.92), rgba(10,10,10,0));}
.nav-logo{font-family:var(--display);font-size:17px;font-weight:900;font-style:italic;letter-spacing:-.02em;color:var(--ink);text-decoration:none;justify-self:start}
.back-btn{justify-self:center;background:none;border:none;cursor:pointer;font-family:var(--mono);font-weight:400;font-size:11px;color:var(--ink);letter-spacing:.28em;text-transform:lowercase;display:flex;align-items:center;gap:14px;padding:8px 0;text-decoration:none}
.back-btn:hover{color:var(--r)}
.bag-btn{justify-self:end;background:none;border:none;cursor:pointer;font-family:var(--mono);font-weight:700;font-size:11px;color:var(--ink);letter-spacing:.22em;text-transform:uppercase;display:flex;align-items:center;gap:8px;padding:8px 0;position:relative}
.bag-btn:hover{color:var(--teal)}
.bag-count{background:var(--teal);color:#fff;font-weight:700;border-radius:99px;min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.bag-count.empty{display:none}

.sh-hero{padding:150px 48px 30px;border-bottom:1px solid var(--line)}
.sh-hero-eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.45em;color:var(--teal);margin-bottom:20px;text-transform:lowercase}
.sh-hero-h{font-family:var(--display);font-size:clamp(34px,6vw,72px);font-weight:900;letter-spacing:-.04em;line-height:.95;text-transform:uppercase}
.sh-hero-sub{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink-d);line-height:1.85;max-width:560px;margin-top:24px}

.sh-brands{position:sticky;top:0;z-index:900;background:rgba(10,10,10,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:16px 48px;display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.sh-brands::-webkit-scrollbar{display:none}
.sh-btab{flex:0 0 auto;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:9px 16px;border:1px solid var(--line-mid);background:none;color:var(--ink-d);cursor:pointer;border-radius:99px;white-space:nowrap;transition:all .2s}
.sh-btab:hover{color:var(--ink);border-color:var(--ink-dd)}
.sh-btab.on{background:var(--ink);color:#0A0A0A;border-color:var(--ink);font-weight:700}

.sh-wrap{padding:36px 48px 100px;max-width:1240px;margin:0 auto}
.sh-brandsec{margin-bottom:52px}
.sh-brandsec-h{font-family:var(--display);font-size:22px;font-weight:900;letter-spacing:-.03em;text-transform:uppercase;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--line-mid);display:flex;align-items:baseline;gap:12px}
.sh-brandsec-h span{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink-d);font-weight:400;text-transform:none}
.sh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.sh-card{background:var(--b3);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .3s}
.sh-card:hover{border-color:var(--line-mid)}
.sh-card.oos{opacity:.5}
.sh-thumb{aspect-ratio:1/1;background:#0d0d0d;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.sh-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.sh-thumb-ph{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--ink-dd);text-transform:uppercase}
.sh-oos-tag{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;background:rgba(255,45,45,.9);color:#fff;padding:4px 8px;border-radius:5px}
.sh-body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.sh-cat{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--ink-d);text-transform:uppercase}
.sh-name{font-family:var(--display);font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.sh-colour{font-family:var(--mono);font-size:10px;color:var(--ink-d);letter-spacing:.05em}
.sh-price{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink);margin-top:2px}
.sh-sizes{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.sh-size{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border:1px solid var(--line-mid);background:none;color:var(--ink);cursor:pointer;border-radius:6px;min-width:34px;transition:all .15s}
.sh-size:hover{border-color:var(--teal)}
.sh-size.sel{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700}
.sh-size.gone{opacity:.28;text-decoration:line-through;cursor:not-allowed;pointer-events:none}
.sh-add{margin-top:auto;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:12px;background:var(--ink);color:#0A0A0A;border:none;font-weight:700;cursor:pointer;border-radius:7px;transition:opacity .2s}
.sh-add:hover{opacity:.85}
.sh-add:disabled{background:#232323;color:#666;cursor:not-allowed}
.sh-empty{font-family:var(--mono);font-size:12px;color:var(--ink-d);text-align:center;padding:80px 0;line-height:2}

/* Cart drawer */
.sh-cart-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1800;display:none;backdrop-filter:blur(3px)}
.sh-cart-ov.open{display:block}
.sh-cart{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);background:var(--b3);border-left:1px solid var(--line-mid);z-index:1850;transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.sh-cart.open{transform:translateX(0)}
.sh-cart-hd{padding:26px 26px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.sh-cart-hd h3{font-family:var(--display);font-size:20px;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}
.sh-cart-close{background:none;border:none;color:var(--ink-d);font-size:26px;cursor:pointer;line-height:1}
.sh-cart-close:hover{color:var(--r)}
.sh-cart-body{flex:1;overflow-y:auto;padding:18px 26px}
.sh-line{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.sh-line-img{width:56px;height:56px;border-radius:7px;background:#0d0d0d;object-fit:cover;flex:0 0 auto}
.sh-line-mid{flex:1;min-width:0}
.sh-line-name{font-family:var(--display);font-size:13px;font-weight:700;line-height:1.25}
.sh-line-meta{font-family:var(--mono);font-size:10px;color:var(--ink-d);margin-top:3px;letter-spacing:.04em}
.sh-line-qty{display:flex;align-items:center;gap:10px;margin-top:8px}
.sh-line-qty button{width:24px;height:24px;border:1px solid var(--line-mid);background:none;color:var(--ink);border-radius:5px;cursor:pointer;font-size:14px;line-height:1}
.sh-line-qty button:hover{border-color:var(--teal)}
.sh-line-qty span{font-family:var(--mono);font-size:12px;min-width:16px;text-align:center}
.sh-line-r{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between}
.sh-line-price{font-family:var(--mono);font-size:12px;font-weight:700}
.sh-line-rm{background:none;border:none;color:var(--ink-dd);font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:2px}
.sh-line-rm:hover{color:var(--r)}
.sh-cart-empty{font-family:var(--mono);font-size:12px;color:var(--ink-d);text-align:center;padding:60px 10px;line-height:2}
.sh-cart-ft{border-top:1px solid var(--line-mid);padding:22px 26px 26px}
.sh-tot{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);margin-bottom:16px}
.sh-tot span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-d)}
.sh-tot b{font-size:20px;font-weight:700;color:var(--ink)}
.sh-collect-note{font-family:var(--mono);font-size:10px;color:var(--ink-d);line-height:1.7;margin-bottom:16px;letter-spacing:.02em}
.sh-cta{width:100%;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:16px;background:var(--teal);color:#fff;border:none;font-weight:700;cursor:pointer;border-radius:8px;transition:opacity .2s}
.sh-cta:hover{opacity:.9}
.sh-cta:disabled{background:#232323;color:#666;cursor:not-allowed}

/* Reserve form fields */
.sh-field{margin-bottom:14px}
.sh-field label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-d);margin-bottom:7px}
.sh-field input{width:100%;background:#0d0d0d;border:1px solid var(--line-mid);border-radius:7px;padding:12px 13px;color:var(--ink);font-family:var(--mono);font-size:13px}
.sh-field input:focus{outline:none;border-color:var(--teal)}
.sh-back{background:none;border:none;color:var(--ink-d);font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;margin-bottom:14px;padding:0}
.sh-back:hover{color:var(--ink)}
.sh-ok-ico{width:56px;height:56px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:6px auto 0}

@media(max-width:640px){
  .sh-hero{padding:130px 22px 24px} .sh-brands{padding:14px 22px} .sh-wrap{padding:28px 22px 90px}
  nav{padding:18px 20px}
}
</style>
</head>

<nav>
  <a href="/" class="nav-logo">DISTRIK.</a>

<div class="sh-brands" id="sh-brands"></div>

<!-- Cart drawer -->
<div class="sh-cart-ov" id="sh-cart-ov" onclick="cartClose()"></div>
<aside class="sh-cart" id="sh-cart">
  <div class="sh-cart-hd"><h3 id="sh-cart-title">Your bag</h3><button class="sh-cart-close" onclick="cartClose()">&times;</button></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script>
var _fbApp=null,_fbDb=null,_fbAuthP=null;
function shFdb(){ if(!_fbApp){var c={apiKey:'AIzaSyC9amKPhl2s_-7qN_Ej0VV7nDkJ7BIXMRc',authDomain:'distrikath80361.firebaseapp.com',projectId:'distrikath80361',storageBucket:'distrikath80361.firebasestorage.app',messagingSenderId:'1039015029135',appId:'1:1039015029135:web:db7583ff1131aed86d03fa'};_fbApp=firebase.apps.length?firebase.app():firebase.initializeApp(c);} if(!_fbDb)_fbDb=_fbApp.firestore(); return _fbDb; }
function shAuth(){ var db=shFdb(); if(!_fbAuthP){ _fbAuthP=(_fbApp.auth?_fbApp.auth().signInAnonymously():Promise.resolve()).then(function(){return db;}).catch(function(e){console.warn('[sh] auth',e&&e.code);return db;}); } return _fbAuthP; }

var CATALOG={}, STOCK={}, IMG={};        // shop_catalog / supply_stock (live) / supply_img
var CART=[];                              // [{id,size,qty,name,sku,brand,brandId,colour,price,img}]
var activeBrand='all';
var SIZE_ORDER=['xxs','xs','s','m','l','xl','xxl','xxxl','os','onesize'];

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtIDR(n){ return 'IDR '+Math.round(n||0).toLocaleString('id-ID'); }
function imgFor(id){ var a=IMG[id]; return (a&&a.length)?a[0]:''; }
// effective live sizes for an item: supply_stock override, else catalog baseline
function sizesFor(id){ var s=(STOCK[id]&&STOCK[id].sizes)?STOCK[id].sizes:((CATALOG[id]&&CATALOG[id].sizes)||{}); return s||{}; }
function sortSizes(keys){ return keys.slice().sort(function(a,b){ var ia=SIZE_ORDER.indexOf(String(a).toLowerCase()), ib=SIZE_ORDER.indexOf(String(b).toLowerCase()); if(ia<0&&ib<0){ var na=parseFloat(a),nb=parseFloat(b); if(!isNaN(na)&&!isNaN(nb))return na-nb; return String(a).localeCompare(String(b)); } if(ia<0)return 1; if(ib<0)return -1; return ia-ib; }); }
function totalStock(id){ var s=sizesFor(id),t=0; Object.keys(s).forEach(function(k){t+=(+s[k]||0);}); return t; }
// how many of a size are still free after what's already in the bag
function freeOf(id,size){ var have=+(sizesFor(id)[size]||0); var inBag=0; CART.forEach(function(l){ if(l.id===id&&l.size===size) inBag+=l.qty; }); return have-inBag; }

// ── selected size per card (transient UI state) ──
var _sel={};
function pickSize(id,size,el){ if(freeOf(id,size)<=0) return; _sel[id]=size; var wrap=el.parentNode; Array.prototype.forEach.call(wrap.children,function(c){c.classList.remove('sel');}); el.classList.add('sel'); var card=wrap.closest('.sh-card'); var btn=card&&card.querySelector('.sh-add'); if(btn){btn.disabled=false;} }

function render(){
  var el=document.getElementById('sh-content'); if(!el) return;
  // Only show items that are active AND have stock — a sold-out or deleted item drops off automatically.
  var items=Object.keys(CATALOG).map(function(k){return CATALOG[k];}).filter(function(it){ return it && it.active!==false && totalStock(it.id)>0; });
  if(!items.length){ el.innerHTML='<div class="sh-empty">The shop is being stocked.<br>Check back soon.</div>'; renderBrands(); return; }
  // group by brand
  var byBrand={};
  items.forEach(function(it){ var b=it.brandId||'_'; (byBrand[b]=byBrand[b]||[]).push(it); });
  var order=Object.keys(byBrand).sort(function(a,b){ return (nameB(a)||'').localeCompare(nameB(b)||''); });
  var shown=order.filter(function(b){ return activeBrand==='all'||activeBrand===b; });
  if(!shown.length){ el.innerHTML='<div class="sh-empty">Nothing here yet.</div>'; renderBrands(); return; }
  el.innerHTML=shown.map(function(b){
    var list=byBrand[b].slice().sort(function(x,y){ return (x.name||'').localeCompare(y.name||''); });
    return '<div class="sh-brandsec">'
      +'<div class="sh-brandsec-h">'+esc(nameB(b)||'Other')+' <span>'+list.length+' item'+(list.length!==1?'s':'')+'</span></div>'
      +'<div class="sh-grid">'+list.map(cardHtml).join('')+'</div>'
    +'</div>';
  }).join('');
  renderBrands();
}
function nameB(bid){ // brand name from any catalog item carrying it
  var hit=Object.keys(CATALOG).map(function(k){return CATALOG[k];}).find(function(it){return it&&it.brandId===bid&&it.brandName;});
  return hit?hit.brandName:(bid==='_'?'Other':bid);
}
function cardHtml(it){
  var sizes=sizesFor(it.id); var keys=sortSizes(Object.keys(sizes).filter(function(k){return true;}));
  var tot=totalStock(it.id); var oos=tot<=0;
  var img=imgFor(it.id);
  var sizeChips=keys.map(function(k){ var free=freeOf(it.id,k); var gone=free<=0; return '<button class="sh-size'+(gone?' gone':'')+(_sel[it.id]===k?' sel':'')+'" '+(gone?'':'onclick="pickSize(\''+it.id+'\',\''+esc(k)+'\',this)"')+'>'+esc(String(k).toUpperCase())+'</button>'; }).join('');
  var canAdd=!oos && !!_sel[it.id];
  return '<div class="sh-card'+(oos?' oos':'')+'">'
    +'<div class="sh-thumb">'+(img?'<img src="'+img+'" alt="'+esc(it.name||'')+'" loading="lazy">':'<span class="sh-thumb-ph">DISTRIK.</span>')+(oos?'<span class="sh-oos-tag">Sold out</span>':'')+'</div>'
    +'<div class="sh-body">'
      +(it.category?'<div class="sh-cat">'+esc(it.category)+'</div>':'')
      +'<div class="sh-name">'+esc(it.name||'')+'</div>'
      +(it.colour?'<div class="sh-colour">'+esc(it.colour)+'</div>':'')
      +'<div class="sh-price">'+fmtIDR(it.price)+'</div>'
      +(oos?'':'<div class="sh-sizes">'+sizeChips+'</div>')
      +'<button class="sh-add" '+(canAdd?'':'disabled')+' onclick="addToBag(\''+it.id+'\')">'+(oos?'Sold out':'Add to bag')+'</button>'
    +'</div>'
  +'</div>';
}
function renderBrands(){
  var el=document.getElementById('sh-brands'); if(!el) return;
  var items=Object.keys(CATALOG).map(function(k){return CATALOG[k];}).filter(function(it){return it&&it.active!==false&&totalStock(it.id)>0;});
  var bset={}; items.forEach(function(it){ if(it.brandId) bset[it.brandId]=1; });
  var brands=Object.keys(bset).sort(function(a,b){return (nameB(a)||'').localeCompare(nameB(b)||'');});
  var tabs=['<button class="sh-btab'+(activeBrand==='all'?' on':'')+'" onclick="setBrand(\'all\')">All</button>']
    .concat(brands.map(function(b){ return '<button class="sh-btab'+(activeBrand===b?' on':'')+'" onclick="setBrand(\''+b+'\')">'+esc(nameB(b))+'</button>'; }));
  el.innerHTML=tabs.join('');
}
function setBrand(b){ activeBrand=b; render(); window.scrollTo({top:document.querySelector('.sh-brands').offsetTop-70,behavior:'smooth'}); }

// ── Bag ──
function addToBag(id){ var size=_sel[id]; if(!size) return; if(freeOf(id,size)<=0){ alert('That size just sold out.'); render(); return; }
  var it=CATALOG[id]; if(!it) return;
  var line=CART.find(function(l){return l.id===id&&l.size===size;});
  if(line){ line.qty++; } else { CART.push({id:id,size:size,qty:1,name:it.name||'',sku:it.sku||'',brand:it.brandName||'',brandId:it.brandId||'',colour:it.colour||'',price:+it.price||0,img:imgFor(id)}); }
  _sel[id]=null; updateBag(); render(); cartOpen();
}
function bagCount(){ return CART.reduce(function(a,l){return a+l.qty;},0); }
function bagTotal(){ return CART.reduce(function(a,l){return a+l.qty*l.price;},0); }
function updateBag(){ var c=document.getElementById('bag-count'); var n=bagCount(); c.textContent=n; c.classList.toggle('empty',n<=0); }
function chgQty(i,d){ var l=CART[i]; if(!l) return; if(d>0 && freeOf(l.id,l.size)<=0){ alert('No more of that size in stock.'); return; } l.qty+=d; if(l.qty<=0) CART.splice(i,1); updateBag(); renderCart(); render(); }
function rmLine(i){ CART.splice(i,1); updateBag(); renderCart(); render(); }

function cartOpen(){ renderCart(); document.getElementById('sh-cart').classList.add('open'); document.getElementById('sh-cart-ov').classList.add('open'); document.body.style.overflow='hidden'; }
function cartClose(){ document.getElementById('sh-cart').classList.remove('open'); document.getElementById('sh-cart-ov').classList.remove('open'); document.body.style.overflow=''; }

function renderCart(){
  document.getElementById('sh-cart-title').textContent='Your bag';
  var body=document.getElementById('sh-cart-body'), ft=document.getElementById('sh-cart-ft');
  if(!CART.length){ body.innerHTML='<div class="sh-cart-empty">Your bag is empty.<br>Add something you love.</div>'; ft.innerHTML=''; return; }
  body.innerHTML=CART.map(function(l,i){
    return '<div class="sh-line">'
      +(l.img?'<img class="sh-line-img" src="'+l.img+'" alt="">':'<div class="sh-line-img"></div>')
      +'<div class="sh-line-mid">'
        +'<div class="sh-line-name">'+esc(l.name)+'</div>'
        +'<div class="sh-line-meta">'+esc(l.brand)+(l.colour?' · '+esc(l.colour):'')+' · Size '+esc(String(l.size).toUpperCase())+'</div>'
        +'<div class="sh-line-qty"><button onclick="chgQty('+i+',-1)">&minus;</button><span>'+l.qty+'</span><button onclick="chgQty('+i+',1)">+</button></div>'
      +'</div>'
      +'<div class="sh-line-r"><div class="sh-line-price">'+fmtIDR(l.qty*l.price)+'</div><button class="sh-line-rm" onclick="rmLine('+i+')">Remove</button></div>'
    +'</div>';
  }).join('');
  ft.innerHTML='<div class="sh-tot"><span>Total</span><b>'+fmtIDR(bagTotal())+'</b></div>'
    +'<div class="sh-collect-note">Pay securely by card now to reserve &middot; collect in person at DISTRIK Canggu.</div>'
    +'<button class="sh-cta" onclick="startReserve()">Checkout</button>';
}

// ── Reserve flow ──
function startReserve(){
  if(!CART.length) return;
  document.getElementById('sh-cart-title').textContent='Checkout';
  var body=document.getElementById('sh-cart-body');
  body.innerHTML='<button class="sh-back" onclick="renderCart()">&larr; back to bag</button>'
    +'<div class="sh-field"><label>Full name</label><input id="rz-name" type="text" placeholder="Your name" autocomplete="name"></div>'
    +'<div class="sh-field"><label>WhatsApp</label><input id="rz-phone" type="tel" placeholder="+62 8xx xxxx xxxx" autocomplete="tel"></div>'
    +'<div class="sh-field"><label>Email</label><input id="rz-email" type="email" placeholder="name@email.com" autocomplete="email"></div>';
  var ft=document.getElementById('sh-cart-ft');
  ft.innerHTML='<div class="sh-tot"><span>To pay now</span><b>'+fmtIDR(bagTotal())+'</b></div>'
    +'<div class="sh-collect-note">Secure card payment. Once paid, we hold your sizes and WhatsApp you when it\'s ready to collect at DISTRIK Canggu.</div>'
    +'<button class="sh-cta" id="rz-submit" onclick="submitReserve()">Pay by card &rarr;</button>';
}
function submitReserve(){
  var name=(document.getElementById('rz-name').value||'').trim();
  var phone=(document.getElementById('rz-phone').value||'').trim();
  var email=(document.getElementById('rz-email').value||'').trim();
  if(!name||!phone){ alert('Please enter your name and WhatsApp number.'); return; }
  var btn=document.getElementById('rz-submit'); if(btn){btn.disabled=true;btn.textContent='Reserving…';}
  var lines=CART.slice();
  var orderTotal=bagTotal();
  var orderCount=lines.reduce(function(a,l){return a+l.qty;},0);
  var orderNo='SH-'+Date.now().toString(36).toUpperCase().slice(-6);
  shAuth().then(function(db){
    return db.runTransaction(function(tx){
      var ids=[]; lines.forEach(function(l){ if(ids.indexOf(l.id)<0) ids.push(l.id); });
      var refs={};
      ids.forEach(function(id){ refs[id]=db.collection('supply_stock').doc(id); });
      // ALL reads first (transaction rule)
      return Promise.all(ids.map(function(id){ return tx.get(refs[id]); })).then(function(snaps){
        var sizesById={};
        ids.forEach(function(id,ix){ var d=snaps[ix]; var base=(d.exists&&d.data()&&d.data().sizes)?d.data().sizes:((CATALOG[id]&&CATALOG[id].sizes)||{}); sizesById[id]=Object.assign({},base); });
        // verify + decrement — holds the sizes the moment the customer checks out (no oversell)
        for(var i=0;i<lines.length;i++){ var l=lines[i]; var s=sizesById[l.id]; var have=+(s[l.size]||0); if(have<l.qty){ var err=new Error('oos'); err._line=l; throw err; } s[l.size]=have-l.qty; }
        // writes: stock down
        ids.forEach(function(id){ tx.set(refs[id],{ id:id, sizes:sizesById[id], ts:firebase.firestore.FieldValue.serverTimestamp(), by:'shop' }); });
        // order doc — PENDING until the card payment lands (webhook flips it to paid)
        var oref=db.collection('supply_orders').doc();
        tx.set(oref,{
          orderNo:orderNo, name:name, phone:phone, email:email,
          items:lines.map(function(l){ return { id:l.id, sku:l.sku, name:l.name, brand:l.brand, brandId:l.brandId, colour:l.colour, size:l.size, qty:l.qty, price:l.price }; }),
          itemCount:orderCount, total:orderTotal,
          status:'pending_payment', paymentStatus:'unpaid', paid:false, channel:'shop', fulfil:'pickup',
          submittedAt:firebase.firestore.FieldValue.serverTimestamp()
        });
        return true;
      });
    });
  }).then(function(){
    // Stock is held + order created. Now take the card payment via Xendit (same as bookings).
    try{ sessionStorage.setItem('sh_last', JSON.stringify({orderNo:orderNo, total:orderTotal, count:orderCount})); }catch(e){}
    if(btn){btn.textContent='Taking you to payment…';}
    return fetch('https://asia-southeast2-distrikath80361.cloudfunctions.net/createShopInvoice',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ref:orderNo, amount:orderTotal, name:name, email:email, phone:phone, items:orderCount})
    }).then(function(r){return r.json();}).then(function(j){
      CART=[]; updateBag();
      if(j&&j.invoice_url){ window.location.assign(j.invoice_url); }
      else { paymentFallback(orderNo); }
    }).catch(function(){ CART=[]; updateBag(); paymentFallback(orderNo); });
  }).catch(function(e){
    if(btn){btn.disabled=false;btn.innerHTML='Pay by card &rarr;';}
    if(e&&e.message==='oos'){ var l=e._line; alert('Sorry — "'+(l?l.name:'an item')+'" (size '+(l?String(l.size).toUpperCase():'')+') just sold out. We\'ve updated your bag.'); render(); startReserve(); return; }
    alert('Something went wrong. Please try again, or WhatsApp us: +62 819 9480 1516\n\n('+(e&&e.message||e)+')');
  });
}
// Invoice couldn't be created — items are still held; tell the customer we'll send a link.
function paymentFallback(orderNo){
  document.getElementById('sh-cart-title').textContent='Almost there';
  var body=document.getElementById('sh-cart-body'), ft=document.getElementById('sh-cart-ft');
  body.innerHTML='<div class="sh-name" style="text-align:center;font-size:20px;margin-top:20px;">Your items are held.</div>'
    +'<div class="sh-line-meta" style="text-align:center;margin-top:10px;font-size:11px;line-height:1.9;">Order '+esc(orderNo)+'<br>We couldn\'t open the card page just now — our team will WhatsApp you a secure payment link to confirm.</div>';
  ft.innerHTML='<button class="sh-cta" onclick="afterReserve()">Done</button>';
}
// Return from Xendit: ?paid=1 (success) or ?paid=0 (failed/abandoned)
function showPaidReturn(ok, ref){
  var info={}; try{ info=JSON.parse(sessionStorage.getItem('sh_last')||'{}'); }catch(e){}
  var rn=ref||info.orderNo||'';
  cartOpen();
  var body=document.getElementById('sh-cart-body'), ft=document.getElementById('sh-cart-ft');
  if(ok){
    try{ if(typeof gtag==='function') gtag('event','conversion',{'send_to':'AW-18443940569/GXsgCP3R3fUcENnl4NpE','value':(info.total||0),'currency':'IDR','transaction_id':rn}); }catch(e){}
    document.getElementById('sh-cart-title').textContent='Paid';
    body.innerHTML='<div class="sh-ok-ico">&#10003;</div>'
      +'<div class="sh-name" style="text-align:center;font-size:22px;margin-top:16px;">Payment received.</div>'
      +'<div class="sh-line-meta" style="text-align:center;margin-top:8px;font-size:11px;line-height:1.9;">Order '+esc(rn)+'<br>Your items are reserved. We\'ll WhatsApp you when they\'re ready to collect at DISTRIK Canggu.</div>';
    ft.innerHTML='<button class="sh-cta" onclick="afterReserve()">Done</button>';
  } else {
    document.getElementById('sh-cart-title').textContent='Payment not completed';
    body.innerHTML='<div class="sh-name" style="text-align:center;font-size:20px;margin-top:20px;">Payment didn\'t go through.</div>'
      +'<div class="sh-line-meta" style="text-align:center;margin-top:10px;font-size:11px;line-height:1.9;">Order '+esc(rn)+'<br>Your sizes are held for a short while. WhatsApp us on +62 819 9480 1516 and we\'ll send a fresh payment link.</div>';
    ft.innerHTML='<button class="sh-cta" onclick="afterReserve()">Close</button>';
  }
  // clean the URL so a refresh doesn't re-show it
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
}
function afterReserve(){ cartClose(); render(); }

window.pickSize=pickSize; window.addToBag=addToBag; window.setBrand=setBrand;
window.cartOpen=cartOpen; window.cartClose=cartClose; window.chgQty=chgQty; window.rmLine=rmLine;
window.startReserve=startReserve; window.submitReserve=submitReserve; window.afterReserve=afterReserve;
window.paymentFallback=paymentFallback; window.showPaidReturn=showPaidReturn;

// ── Live data ──
shAuth().then(function(db){
  db.collection('shop_catalog').onSnapshot(function(snap){ var m={}; snap.forEach(function(d){m[d.id]=d.data();}); CATALOG=m; render(); }, function(e){ console.warn('[sh] catalog',e); document.getElementById('sh-content').innerHTML='<div class="sh-empty">Couldn\'t load the shop. Please refresh.</div>'; });
  db.collection('supply_stock').onSnapshot(function(snap){ var m={}; snap.forEach(function(d){m[d.id]=d.data();}); STOCK=m; render(); }, function(e){ console.warn('[sh] stock',e); });
  db.collection('supply_img').onSnapshot(function(snap){ var m={}; snap.forEach(function(d){ var x=d.data(); if(x&&x.images) m[d.id]=x.images; }); IMG=m; render(); }, function(e){ console.warn('[sh] img',e); });
});

// ── Return from Xendit card payment ──
(function(){
  try{
    var q=new URLSearchParams(location.search);
    if(q.has('paid')){ showPaidReturn(q.get('paid')==='1', q.get('ref')||''); }
  }catch(e){}
})();
</script>
